[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-pool"
version = "0.3.0"
description = "OpenCode Go 多账号合并代理后端（账号池 / 路由 / 切换）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "build>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_pool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：FastAPI Depends() 默认参数是该生态标准写法，误报
ignore = ["B008"]
