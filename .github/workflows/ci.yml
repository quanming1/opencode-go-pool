name: CI

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

# tag 推送时需要创建/上传 GitHub Release（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

jobs:
  backend:
    name: Backend (pytest + ruff + wheel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]" build
      - name: Ruff lint
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel --outdir dist
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          if-no-files-found: error

  web:
    name: Web (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  pack:
    name: Pack (assemble + verify release package)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: _artifacts/backend-dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: _artifacts/web-dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble and verify release package
        run: |
          python scripts/package_release.py --out release --root . \
            --backend-dist _artifacts/backend-dist \
            --web-dist _artifacts/web-dist --smoke-install
      - name: Package report
        run: |
          ls -lh release/
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('release/*.zip')[0]); print('files inside:', len(z.namelist()))"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/*.zip
          if-no-files-found: error
      - name: Upload to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "v${VERSION}" release/*.zip --title "v${VERSION}" || true
          gh release upload "v${VERSION}" release/*.zip --clobber
